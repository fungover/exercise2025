<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Patient</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<form method="post" th:action="@{/api/patients/new}" th:object="${patient}">

    <label for="firstName">First Name:</label><input type="text" id="firstName" th:field="*{firstName}">
    <label for="lastName">Last Name:</label><input type="text" id="lastName" th:field="*{lastName}">
    <label for="address">Address:</label><input type="text" id="address" th:field="*{address}">
    <label for="dob">Date of Birth:</label><input type="date" id="dob" th:field="*{dateOfBirth}">
    <label for="ssn">Social Security Number:</label><input type="text" id="ssn" th:field="*{ssn}">
    <input type="submit">
</form>
</body>
</html>
