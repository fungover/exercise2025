services:
  mysql:
    image: mysql:9.5.0
    environment:
      - MYSQL_DATABASE=${DATABASE_NAME}
      - MYSQL_USER=${DATABASE_USER}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql9data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u ${DATABASE_USER} -p${DATABASE_PASSWORD} || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql9data:
