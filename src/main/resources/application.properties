spring.application.name=exercise2025

spring.datasource.url=jdbc:mysql://localhost:3306/quotesdb
spring.datasource.username=quotesuser
spring.datasource.password=quotespass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# schema.sql in tests, Hibernate in prod.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# removed explicit MySQL dialect

spring.thymeleaf.cache=false
server.port=8080
