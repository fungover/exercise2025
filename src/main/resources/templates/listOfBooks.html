<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <div th:fragment="listOfBooks">
        <h2>Books in store</h2>
        <ol>
        <li th:each="bookDto : ${books}"
        ><span th:text="${bookDto.title}"></span> by <span th:text="${bookDto.author.firstName}"></span> <span th:text="${bookDto.author.lastName}"></span></li>
        </ol>
    </div>
</body>
</html>
