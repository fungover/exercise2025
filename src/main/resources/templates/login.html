<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zoo Login</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5rem;
        }

        form {
            border: 1px solid #ccc;
            padding: 2rem;
            border-radius: 8px;
        }

        input {
            margin: .5rem 0;
            padding: .5rem;
            width: 200px;
        }

        button {
            padding: .5rem 1rem;
            margin-top: .5rem;
        }
    </style>
</head>
<body>
<h1>Zoo Login</h1>
<form th:action="@{/login}" method="post">
    <div><input type="text" name="username" placeholder="Username" required>
    </div>
    <div><input type="password" name="password" placeholder="Password" required>
    </div>
    <div>
        <button type="submit">Login</button>
    </div>
    <p th:if="${param.error}" style="color:red;">Invalid username or password</p>
    <p th:if="${param.logout}" style="color:green;">You have been logged out</p>
</form>

</body>
</html>
