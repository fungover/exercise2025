spring:
  application:
    name: exercise2025
  datasource:
    url: jdbc:mysql://localhost:3306/petDb?useSSL=false&allowPublicKeyRetrieval=true
    username: petuser
    password: petpass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  thymeleaf:
    cache: false
logging:
  level:
    org.springframework.web: DEBUG