<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Min profil</title>
</head>
<body>
<h1>Min profil</h1>
<p>Användare: <strong th:text="${username}">user</strong></p>

<h2>Mina PRs</h2>
<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>Övning</th>
        <th>Reps</th>
        <th>Vikt (kg)</th>
        <th>Datum</th>
        <th>Ta bort</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="pr : ${prs}">
        <td th:text="${pr.exerciseName}">Bench Press</td>
        <td th:text="${pr.reps}">5</td>
        <td th:text="${pr.weightKg}">100.0</td>
        <td th:text="${pr.achievedOn}">2025-11-01</td>
        <td>
            <form th:action="@{'/profile/pr/' + ${pr.id}}" method="post">
                <input type="hidden" name="_method" value="delete"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit">🗑</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<h2>Lägg till/uppdatera PR</h2>
<form th:action="@{/profile/pr}" method="post">
    <label>Övning:
        <select name="exerciseId" required>
            <option th:each="ex : ${exercises}"
                    th:value="${ex.id}"
                    th:text="${ex.name}">Bench Press
            </option>
        </select>
    </label>
    <br>
    <label>Reps: <input type="number" name="reps" min="1" required></label><br>
    <label>Vikt (kg): <input type="number" step="0.01" name="weightKg" required></label><br>
    <label>Datum: <input type="date" name="achievedOn" required></label><br>

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit">Spara PR</button>
</form>

<p><a th:href="@{/}">Hem</a></p>
</body>
</html>
