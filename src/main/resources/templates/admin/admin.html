<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin</title>
</head>
<body>
<div th:replace="fragments/navbar :: main-nav">
</div>
<h1>Admin</h1>
<p>Welcome to the Admin page.</p>

<hr>

<h2>Add Director</h2>
<div th:replace="fragments/director/add_director :: add_director"></div>

<h2>Manage Directors</h2>
<ul>
    <li th:each="director : ${directors}" style="margin-top: 1rem">
        <a th:href="@{/director/{id}(id=${director.id})}" th:text="${director.firstName} + ' ' + ${director.lastName}"></a>
        <button class="update-director-btn" th:data-director-id="${director.id}">Update</button>
        <button class="delete-director-btn" th:data-director-id="${director.id}">Delete</button>
        <div th:replace="fragments/director/update_director :: _form(directorId=${director.id})"></div>
    </li>
</ul>

<hr>

<h2>Add Movie</h2>
<div th:replace="fragments/movie/add_movie :: add_movie"></div>

<h2>Manage Movies</h2>
<ul>
    <li th:each="movie : ${movies}" style="margin-top: 1rem">
        <a th:href="@{/movie/{id}(id=${movie.id})}" th:text="${movie.title}"></a>
        <button class="update-movie-btn" th:data-movie-id="${movie.id}">Update</button>
        <button class="delete-movie-btn" th:data-movie-id="${movie.id}">Delete</button>
        <div th:replace="fragments/movie/update_movie :: _form(movieId=${movie.id})"></div>
    </li>
</ul>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.update-director-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const directorId = this.dataset.directorId;
                toggleDirectorForm(directorId);
            })
        })

        document.querySelectorAll('.delete-director-btn').forEach(btn => {
            btn.addEventListener('click', function(event) {
                const directorId = this.dataset.directorId;
                if (confirm('Are you sure you want to delete this director?')) {
                    handleDirectorDelete(event, directorId);
                }
            })
        })

        document.querySelectorAll('.update-movie-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const movieId = this.dataset.movieId;
                toggleMovieForm(movieId);
            })
        })

        document.querySelectorAll('.delete-movie-btn').forEach(btn => {
            btn.addEventListener('click', function(event) {
                const movieId = this.dataset.movieId;
                if (confirm('Are you sure you want to delete this movie?')) {
                    handleMovieDelete(event, movieId);
                }
            })
        })

        document.querySelector('#add-director-form').addEventListener('submit', handleAddDirector);
        document.querySelector('#add-movie-form').addEventListener('submit', handleAddMovie);
    });

    function toggleDirectorForm(directorId) {
        const formId = 'update-director-form-container-' + directorId;
        const formElement = document.getElementById(formId);

        if (formElement.style.display === 'none') {
            formElement.style.display = 'block';
        } else {
            formElement.style.display = 'none';
        }
    }

    function toggleMovieForm(movieId) {
        const formId = 'update-movie-form-container-' + movieId;
        const formElement = document.getElementById(formId);

        if (formElement.style.display === 'none') {
            formElement.style.display = 'block';
        } else {
            formElement.style.display = 'none';
        }
    }

    async function handleDirectorUpdate(event, formElement) {
        event.preventDefault();
        const directorId = formElement.dataset.directorId;

        const formData = new FormData(formElement);
        const allData = Object.fromEntries(formData);

        const data = {};

        if (allData.firstName && allData.firstName.trim()) {
            data.firstName = allData.firstName.trim();
        }
        if (allData.lastName && allData.lastName.trim()) {
            data.lastName = allData.lastName.trim();
        }

        const response = await fetch(`/api/director/${directorId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            window.location.reload();
        } else {
            alert('Failed to update director');
        }
    }

    async function handleMovieUpdate(event, formElement) {
        event.preventDefault();
        const movieId = formElement.dataset.movieId;

        const formData = new FormData(formElement);
        const allData = Object.fromEntries(formData);

        const data = {};

        if (allData.title && allData.title.trim()) {
            data.title = allData.title.trim();
        }
        if (allData.duration && allData.duration.trim()) {
            data.duration = parseInt(allData.duration);
        }
        if (allData.genre && allData.genre.trim()) {
            data.genre = allData.genre.trim();
        }

        console.log(allData);
        console.log(data);

        const response = await fetch(`/api/movie/${movieId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });

        if (response.ok) {
            window.location.reload();
        } else {
            alert('Failed to update movie');
        }
    }

    async function handleDirectorDelete(event, directorId) {
        event.preventDefault();

        const response = await fetch(`/api/director/${directorId}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json'
            }
        });

        if (response.ok) {
            window.location.reload();
        } else {
            alert('Failed to delete director');
        }

    }

    async function handleMovieDelete(event, movieId) {
        event.preventDefault();

        const response = await fetch(`/api/movie/${movieId}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json'
            }
        })

        if (response.ok) {
            window.location.reload();
        } else {
            alert('Failed to delete movie');
        }
    }

    let movieCount = 0;

    function addMovieForm() {
        const container = document.getElementById('movies-container');
        const movieIndex = movieCount++;

        const movieDiv = document.createElement('div');
        movieDiv.className = 'movie-form';
        movieDiv.id = `movie-${movieIndex}`;
        movieDiv.style.marginBottom = '1rem';
        movieDiv.style.padding = '1rem';
        movieDiv.style.border = '1px solid #ccc';

        movieDiv.innerHTML = `
        <h5>Movie ${movieIndex + 1}</h5>

        <label for="movie-title-${movieIndex}">Title:</label>
        <input type="text" id="movie-title-${movieIndex}" name="movies[${movieIndex}].title" required>

        <label for="movie-duration-${movieIndex}">Duration (minutes):</label>
        <input type="number" id="movie-duration-${movieIndex}" name="movies[${movieIndex}].duration" required>

        <label for="movie-genre-${movieIndex}">Genre:</label>
        <input type="text" id="movie-genre-${movieIndex}" name="movies[${movieIndex}].genre" required>

        <button type="button" onclick="removeMovieForm(${movieIndex})">Remove Movie</button>
    `;

        container.appendChild(movieDiv);
    }

    function removeMovieForm(index) {
        const movieDiv = document.getElementById(`movie-${index}`);
        if (movieDiv) {
            movieDiv.remove();
        }
    }

    async function handleAddDirector(event) {
        event.preventDefault();

        const formData = new FormData(event.target);
        console.log("FormData contents:");
        for (let [key, value] of formData.entries()) {
            console.log(key, ":", value);
        }

        const firstName = formData.get('firstName');
        const lastName = formData.get('lastName');

        const data = {
            firstName: firstName.trim(),
            lastName: lastName.trim(),
            movies: []
        }

            for (let i = 0; i < movieCount; i++) {
                const title = formData.get(`movies[${i}].title`);
                const duration = formData.get(`movies[${i}].duration`);
                const genre = formData.get(`movies[${i}].genre`);

                if (title !== null && duration !== null && genre !== null) {
                    data.movies.push({
                        title: title.trim(),
                        duration: parseInt(duration),
                        genre: genre.trim()
                    });
                }
            }

        const response = await fetch('/api/director', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })

        if (response.ok) {
            window.location.reload();
        } else {
            alert('Failed to add director');
        }
    }

    async function handleAddMovie(event) {
        event.preventDefault();

        const formData = new FormData(event.target);

        const title = formData.get('title');
        const duration = formData.get('duration');
        const genre = formData.get('genre');
        const directorId = parseInt(formData.get('director'));

        const data = {
            title: title.trim(),
            duration: parseInt(duration),
            genre: genre.trim(),
            directorId: directorId
        }

        const response = await fetch('/api/movie', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })

        if (response.ok) {
            window.location.reload();
        } else {
            alert('Failed to add movie');
        }
    }

</script>
</body>
</html>
