<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patients Menu</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div>
    <h1>Patients Menu</h1>
    <a href="/patients" th:text="@{all patients}"></a>
    <a href="/patients/new" th:text="@{new patient}"></a>
    <a href="/patients/find" th:text="@{find patient}"></a>
    <a href="/patients/delete" th:text="@{delete patient}"></a>
</div>
</body>
</html>
