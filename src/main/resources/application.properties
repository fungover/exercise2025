# DATASOURCE (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3307/bolaneradarmini?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=app
spring.datasource.password=app
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
# Skapar tabeller automatiskt om de inte finns
spring.jpa.hibernate.ddl-auto=update

# Visa SQL i konsolen (bra f�r utveckling)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# THYMELEAF
spring.thymeleaf.cache=false

# SECURITY (enkel inloggning)
spring.security.user.name=admin
spring.security.user.password=innebandy

# Server-port settings (Default is 8080)
server.port=8081