<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Pet Adoption Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f7f8fc, #e2e8f0);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: #4b6cb7;
            background-image: linear-gradient(to right, #182848, #4b6cb7);
            width: 100%;
            text-align: center;
            color: white;
            padding: 20px 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
        }

        section {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 20px;
            padding: 30px;
            padding-top: 10px;
            width: 90%;
            max-width: 400px;  /* Narrower for login form */
            transition: transform 0.2s ease;
        }

        h2 {
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #4b6cb7;
        }

        button {
            background-color: #4b6cb7;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
            width: 100%;  /* Full width for better UX */
        }

        button:hover {
            background-color: #3a58a3;
            transform: translateY(-1px);
        }

        button:active {
            transform: scale(0.98);
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        footer {
            margin-top: auto;
            padding: 10px;
            text-align: center;
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<header>
    <h1>🐾 Pet Adoption Service 🐾</h1>
</header>
<section>
    <h2>Login to Manage Pets</h2>
    <div th:if="${param.error}" class="error">
        Invalid username or password. Please try again.
    </div>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit">Login</button>
    </form>
</section>

<footer>
    © 2025 Pet Adoption Service. All rights reserved.
</footer>
</body>
</html>
