<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Adoption Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f7f8fc, #e2e8f0);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: #4b6cb7;
            background-image: linear-gradient(to right, #182848, #4b6cb7);
            width: 100%;
            text-align: center;
            color: white;
            padding: 20px 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
        }

        section {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 20px;
            padding: 30px;
            padding-top: 10px;
            width: 90%;
            max-width: 700px;
            transition: transform 0.2s ease;
        }

        h2 {
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #4b6cb7;
        }

        button {
            background-color: #4b6cb7;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #3a58a3;
            transform: translateY(-1px);
        }

        button:active {
            transform: scale(0.98);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        #response {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background-color: #f1f5f9;
            font-family: monospace;
            font-size: 0.95rem;
            min-height: 100px;
            white-space: pre-wrap;
            border: 1px solid #d1d5db;
        }

        footer {
            margin-top: auto;
            padding: 10px;
            text-align: center;
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<header>
    <h1>🐾 Pet Adoption Service 🐾</h1>
</header>

<section>
    <h2>Adopt the pet of your dreams!</h2>
    <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" required>
    </div>
    <div class="form-group">
        <label for="species">Species:</label>
        <input type="text" id="species" required>
    </div>
    <div class="form-group">
        <label for="hungerLevel">Hunger Level (0–100):</label>
        <input type="number" id="hungerLevel" min="0" max="100" required>
    </div>
    <div class="form-group">
        <label for="happiness">Happiness Level (0–100):</label>
        <input type="number" id="happiness" min="0" max="100" required>
    </div>
    <div class="button-group">
        <button onclick="adoptPet()">Adopt Pet</button>
        <button onclick="listPets()">List All Pets</button>
    </div>
</section>

<section>
    <div id="response">Your results will appear here...</div>
</section>

<section>
    <h2>Care for your adopted pet</h2>
    <div class="form-group">
        <label for="id">Pet ID (for existing pets):</label>
        <input type="number" id="id" placeholder="For get, feed, play, or release">
    </div>
    <div class="button-group">
        <button onclick="getPet()">Get Pet by ID</button>
        <button onclick="feedPet()">Feed Pet</button>
        <button onclick="playPet()">Play Pet</button>
        <button onclick="releasePet()">Release Pet</button>
    </div>
</section>

<footer>
    © 2025 Pet Adoption Service. All rights reserved.
</footer>

<script>
    const baseUrl = 'https://pet-adoption.ekedala-services.se/api/pets';

    async function fetchApi(method, path, body = null) {
        try {
            const options = {
                method,
                headers: { 'Content-Type': 'application/json' }
            };
            if (body) options.body = JSON.stringify(body);
            const response = await fetch(`${baseUrl}${path}`, options);
            const text = await response.text();
            let display;
            if (response.ok) {
                try {
                    display = JSON.stringify(JSON.parse(text), null, 2);
                } catch {
                    display = text;
                }
            } else {
                display = `❌ Error ${response.status}: ${text}`;
            }
            document.getElementById('response').textContent = display;
        } catch (error) {
            document.getElementById('response').textContent = `⚠️ Network Error: ${error.message}`;
        }
    }

    function adoptPet() {
        const pet = {
            name: document.getElementById('name').value,
            species: document.getElementById('species').value,
            hungerLevel: parseInt(document.getElementById('hungerLevel').value),
            happiness: parseInt(document.getElementById('happiness').value)
        };
        fetchApi('POST', '', pet);
    }

    function listPets() { fetchApi('GET', ''); }
    function getPet() {
        const id = document.getElementById('id').value;
        fetchApi('GET', `/${id}`);
    }
    function feedPet() {
        const id = document.getElementById('id').value;
        fetchApi('PUT', `/${id}/feed`);
    }
    function playPet() {
        const id = document.getElementById('id').value;
        fetchApi('PUT', `/${id}/play`);
    }
    function releasePet() {
        const id = document.getElementById('id').value;
        fetchApi('DELETE', `/${id}`);
    }
</script>
</body>
</html>
