version: "3.9"
services:
  mysql:
    image: mysql:9
    container_name: todo-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-todo_db}
      MYSQL_USER: ${MYSQL_USER:-todo_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-todopass}
    volumes:
      - exercise2025_mysql_data:/var/lib/mysql

volumes:
  exercise2025_mysql_data: